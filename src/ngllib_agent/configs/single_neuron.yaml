# Single-neuron max-Z; supply env.parquet_path for the user's skeleton table.
env:
  backend: simulator
  parquet_path: null
  orientation: euler
  renderer: gpu
  max_episode_steps: 300
  projection_scale_range: [3500, 14000]
  pane_mode: atomic
obs:
  mode: dino
  use_left_pane: false
  dino:
    model_name: dinov2_vits14
    input_size: 224
    patch_tokens: true
    cuda_graph: true
    compile: false
    fp16: false
    noop: false
model:
  pos_hidden_dim: 64
  normalize_entropy: true
  cell_entropy_stopgrad: false
  cell_entropy_scale: 1.0
  dbl_entropy_scale: 1.0
  verb_entropy_scale: 1.0
  cell_entropy_schedule: null
  dbl_entropy_schedule: null
  verb_entropy_schedule: null
  spatial_channels: 128
  spatial_blocks: 3
  flat_channels: 16
  hidden: 512
  autocast_bf16: true
action:
  verbs: 3
  grid_rows: 16
  grid_cols: 16
  click_bounds: [900, 23, 1800, 876]
  split_click_heads: false
  rotation_bins_per_axis: 9
  rotation_step_rad: 0.08
  zoom_bins: 9
  zoom_step: 500.0
reward:
  mode: z_navigate
  z_tolerance: 10.0
  z_tolerance_frac: 0.05
  success: 1.0
  z_shaping_coef: 0.001
  step_penalty: 0.0
ppo:
  train_batch_size: 2000
  sgd_minibatch_size: 256
  num_sgd_iter: 4
  entropy_coeff: [[0, 0.2], [900000, 0.05], [3000000, 0.01]]
  gamma: 0.99
  lambda: 0.95
  clip_param: 0.2
  lr: 0.0003
  kl_target: 0.01
