[project]
name = "tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.3",
    "imageio[ffmpeg]>=2.34.0",
    "msgpack>=1.1.2",
    "ngllib",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "selenium>=4.41.0",
    "stable-baselines3>=2.8.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "wandb>=0.26.0",
]

[tool.uv.sources]
ngllib = { path = "../neurogym", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
