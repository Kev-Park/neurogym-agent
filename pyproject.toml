[project]
name = "ngllib-agent"
version = "0.1.0"
description = "Distributed RL (RLlib PPO) for FlyWire neuron navigation in Neuroglancer, on top of ngllib 0.2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ngllib>=0.2,<0.3",
    "ray[rllib]>=2.40,<3",   # new API stack (RLModule/EnvRunner); py3.12 + gymnasium 1.x
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26",
    "pyarrow>=14.0.0",
    "duckdb>=0.10",
    "gymnasium",
    "pyyaml>=6.0",
    "wandb>=0.16",
    # native-renderer branch: browser-free backend (ngllib.native)
    "moderngl>=5.10",
    "cloud-volume>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # rollout-video encoding (scripts/eval_video.py); imageio-ffmpeg bundles
    # its own ffmpeg binary — compute nodes have no system ffmpeg.
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[tool.uv.sources]
# native-renderer branch: worktree checkouts sit side by side as
# wt/neurogym-native + wt/neurogym-agent-native (revert to ../neurogym on merge).
ngllib = { path = "../neurogym-native", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
