[project]
name = "ngllib-agent"
version = "0.1.0"
description = "Distributed RL (RLlib PPO) for FlyWire neuron navigation in Neuroglancer, on top of ngllib 0.2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ngllib>=0.2,<0.3",
    "ray[rllib]==2.9.*",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26",
    "pyarrow>=14.0.0",
    "duckdb>=0.10",
    "gymnasium",
    "pyyaml>=6.0",
    "wandb>=0.16",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
ngllib = { path = "../neurogym", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
